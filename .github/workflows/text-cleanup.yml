name: Text cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[text-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean visible text
        shell: python
        run: |
          from pathlib import Path
          import re

          replacements = {
              "Agentur-Overhead": "Agenturkosten",
              "Double-Opt-in": "Anmeldung mit Bestätigung",
              "SEO-Basis": "SEO Grundlagen",
              "Basis-SEO": "SEO Grundlagen",
              "Security-orientiert": "sicherheitsorientiert",
              "Security-orientierte": "sicherheitsorientierte",
              "Analyse-Workflows": "Analyse Workflows",
              "Security-Tools": "Security Tools",
              "Security-Ressourcen": "Security Ressourcen",
              "Web-Security": "Web Security",
              "Full-Stack": "Full Stack",
              "Open-Source": "Open Source",
              "IT-Teams": "IT Teams",
              "Web-Analyse": "Web Analyse",
              "Log-Analyse": "Log Analyse",
              "Incident-Response": "Incident Response",
              "Cyber-News": "Cyber News",
              "Business-Website": "Business Website",
              "Business-Websites": "Business Websites",
          }

          for path in Path("src").rglob("*.tsx"):
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)

              # Nur sichtbaren JSX Text bearbeiten, niemals URLs, CSS Klassen oder Codeausdrücke.
              def clean_node(match):
                  value = match.group(1)
                  value = re.sub(r"(?<=\w)[-–](?=\w)", " ", value)
                  value = value.replace(" - ", " und ")
                  return ">" + value + "<"

              text = re.sub(r">([^<>]+)<", clean_node, text)
              if text != original:
                  path.write_text(text, encoding="utf-8")

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[text-cleanup] Sichtbare Texte bereinigen"
          git push
