name: Refresh Cyber News RSS

on:
  schedule:
    # GitHub Actions cron uses UTC. 12:00 UTC = 14:00 CEST / 13:00 CET.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh RSS cache
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          auth_args=()
          if [ -n "${CRON_SECRET:-}" ]; then
            auth_args=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            -H "User-Agent: linuxaaron-rss-refresh/1.2" \
            "${auth_args[@]}" \
            https://linuxaaron.dpdns.org/api/cron/news
