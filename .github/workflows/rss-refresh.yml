name: Refresh Cyber News RSS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh RSS cache
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -H "User-Agent: linuxaaron-rss-refresh/1.0" \
            https://linuxaaron.dpdns.org/api/cron/news
