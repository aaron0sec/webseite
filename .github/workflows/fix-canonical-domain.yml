name: Fix canonical domain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy domain in JSON-LD
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/app/page.tsx")
          text = path.read_text(encoding="utf-8")
          old = "https://linuxaaron.dpdns.org"
          new = "https://joschaschmidt.com"
          if old not in text:
              raise SystemExit("Legacy domain not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Remove one-off workflow
        run: rm -f .github/workflows/fix-canonical-domain.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx .github/workflows/fix-canonical-domain.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: use primary domain in structured data"
          git push
